function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){ storageBlocked=true; MEM[k]=v; } }

<script>
"use strict";

function prof(){ return PROFILES[S.profile]||PROFILES.hunter; }
function weekPlan(){ return WEEKS[S.profile]||WEEKS.hunter; }
function planFor(i){
  let p=weekPlan()[i];
  if(S.profile==="trainee"&&p.t==="stretch"&&TGATES[p.key]) p=Object.assign({},p,{key:TGATES[p.key]});
  return p;
}
function gateForToday(){
  const wd=new Date().getDay();
  return (wd>=1&&wd<=5)?wd-1:(wd===6?5:6);
}
const DAYLBL=["MON","TUE","WED","THU","FRI","SAT","SUN"];
function trainWeek(){ return Math.floor(dayDiff(S.trainStart||todayStr(), todayStr())/7)+1; }
function isDeload(){
  const plan=window.Cloud && Cloud.todayPlan && Cloud.todayPlan();
  return Logic.isDeloadActive({
    profileDeload: !!prof().deload,
    trainWeek: trainWeek(),
    deloadWk: S.deloadWk,
    planDeload: !!(plan && plan.deload),
    sessionDeload: !!(S.session && S.session.deload)
  });
}
function deloadPromptDue(){
  return Logic.shouldPromptDeload({
    profileDeload: !!prof().deload,
    trainWeek: trainWeek(),
    deloadWk: S.deloadWk,
    deloadSkip: S.deloadSkip,
    hasPlan: !!(window.Cloud && Cloud.todayPlan && Cloud.todayPlan()),
    authPending: !!(window.Cloud && Cloud.authSettled && !Cloud.authSettled())
  });
}
function deloadW(w){ return w<0 ? w : Math.max(5, Math.round(w*0.85/5)*5); }
/* weekend-id for jocelyne's pool: the Saturday date of this weekend */
function weekendId(){
  const d=new Date(); const wd=d.getDay();
  const sat=new Date(d); sat.setDate(d.getDate()+(6-wd)%7-(wd===0?7:0)+(wd===0?0:0));
  if(wd===0){ sat.setDate(d.getDate()-1); }
  return sat.toLocaleDateString("en-CA");
}

function defaultDaily(){
  return { count:0, lastComplete:null, todayD:null, parts:[0,0,0], bestKm:0, enabled:true };
}
function defaultState(){
  return { level:1, xp:0, totalXp:0, quests:0, cardioDone:0, tonnage:0,
           streak:0, bestStreak:0, workStreak:0, workBestStreak:0, lastDone:null, lastWeighXp:null,
           name:null, profile:"hunter", gateV:{},
           lastBackup:null, bkSnooze:null, decayNote:null,
           ex:{}, cardioLvl:1, recDone:0, recN:{}, weights:[], log:[], session:null,
           daily: defaultDaily() };
}
let S;
try { S = JSON.parse(lsGet(KEY)) || defaultState(); }
catch(e){ S = defaultState(); }
if(!S.daily) S.daily = defaultDaily();
if(S.daily.enabled===undefined) S.daily.enabled=true;
if(!Array.isArray(S.daily.parts) || typeof S.daily.parts[0]!=="number") S.daily.parts=[];
if(S.name===undefined) S.name=null;
if(!S.profile) S.profile="hunter";
if(!S.gateV) S.gateV={};
if(Array.isArray(S.gateVar)){
  S.gateV.hBack=S.gateVar[0]||0; S.gateV.hLegs=S.gateVar[1]||0;
  S.gateV.hSho=S.gateVar[2]||0;  S.gateV.hChest=S.gateVar[4]||0;
  delete S.gateVar;
}
if(S.lastBackup===undefined){ S.lastBackup=null; S.bkSnooze=null; }
if(S.profile==="hunter" && S.name==="ADAM" && !S.fx714){ S.fx714=1; S.gateV={}; }
if(typeof S.shield!=="number") S.shield=0;
if(typeof S.workStreak!=="number") S.workStreak=0;
if(typeof S.workBestStreak!=="number") S.workBestStreak=0;
if(S.missNote===undefined) S.missNote=null;
if(!S.theme) S.theme="violet";
if(S.profile==="hunter" && S.name==="ADAM" && !S.fxFast1){ S.fxFast1=1; S.fastLog=[]; S.fastStart=null; S.fastXpD=null; }
if(S.daily) delete S.daily.penalty;
if(S.fastStart===undefined) S.fastStart=null;
if(!S.fastTarget) S.fastTarget=16;
if(!Array.isArray(S.fastLog)) S.fastLog=[];
if(S.fastXpD===undefined) S.fastXpD=null;
function fastHrs(){ return S.fastStart ? (Date.now()-new Date(S.fastStart).getTime())/36e5 : 0; }
function fastSecs(){ return S.fastStart ? Math.max(0,Math.floor((Date.now()-new Date(S.fastStart).getTime())/1000)) : 0; }
function fmtHMS(s){ const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return h+":"+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0"); }
function fmtHM(s){ const h=Math.floor(s/3600),m=Math.floor(s%3600/60);
  return (h?h+"h ":"")+m+"m"; }
function fmtGoal(h){ h=Math.round(h*10)/10;
  if(h<24) return h+"h";
  const d=Math.floor(h/24), r=Math.round((h-d*24)*10)/10;
  return d+"d"+(r?" "+r+"h":""); }
function customGoal(){
  const d=Math.floor(S.fastTarget/24), h=Math.round((S.fastTarget-d*24)*10)/10;
  modal(`<h2>⚠ SET GOAL</h2><div class="muted">Choose any length.</div>
    <div style="display:flex;gap:10px;justify-content:center;align-items:flex-end;margin:16px 0">
      <div><div class="muted" style="font-size:10px;letter-spacing:2px">DAYS</div>
        <input class="cin" id="gD" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" value="${d}" style="width:78px;font-size:22px;padding:10px 4px"></div>
      <div><div class="muted" style="font-size:10px;letter-spacing:2px">HOURS</div>
        <input class="cin" id="gH" type="text" inputmode="decimal" autocomplete="off" value="${h}" style="width:78px;font-size:22px;padding:10px 4px"></div>
    </div>
    <button class="btn" onclick="saveGoal()">SET GOAL</button>
    <button class="btn ghost" onclick="closeModal()">CANCEL</button>`);
}
function saveGoal(){
  const dEl=document.getElementById("gD"), hEl=document.getElementById("gH");
  const dRaw=parseWhole(dEl&&dEl.value), hRaw=parseNum(hEl&&hEl.value);
  const d=Math.min(14, Math.max(0, isFinite(dRaw)?dRaw:0));
  const h=Math.min(23, Math.max(0, isFinite(hRaw)?hRaw:0));
  const total=d*24+h;
  if(!(total>0)){ modal(`<h2>⚠ SYSTEM</h2><div>Set a goal longer than zero.</div><button class="btn" onclick="customGoal()">BACK</button>`); return; }
  S.fastTarget=Math.min(336,total); save(); closeModal(); vWeight();
}
let FTMR=null;
function fastTick(){
  const el=document.getElementById("fastClock");
  if(!el||!S.fastStart){ if(FTMR){clearInterval(FTMR);FTMR=null;} return; }
  const s=fastSecs(), goal=S.fastTarget*3600, over=s>=goal;
  el.textContent=fmtHMS(s);
  const ring=document.getElementById("fastRing");
  if(ring){
    ring.setAttribute("stroke-dashoffset",(552.9*(1-Math.min(1,s/goal))).toFixed(1));
    ring.setAttribute("stroke",over?"var(--good)":"var(--p)");
  }
  const sub=document.getElementById("fastSub");

let ACTX=null, WL=null, TMR=null;
function initAudio(){
  try{ if(!ACTX) ACTX=new (window.AudioContext||window.webkitAudioContext)(); if(ACTX.state==="suspended") ACTX.resume(); }catch(e){}
}
function tone(f,d,off){
  if(!ACTX) return;
  try{
    const o=ACTX.createOscillator(), g=ACTX.createGain();
    o.type="sine"; o.frequency.value=f; o.connect(g); g.connect(ACTX.destination);
    const t=ACTX.currentTime+off;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.9,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.start(t); o.stop(t+d+0.05);
  }catch(e){}
}
function wakeAudio(){ try{ if(ACTX&&ACTX.state!=="running") ACTX.resume(); }catch(e){} }
function cue(p){
  wakeAudio();
  if(p==="run"){ tone(880,.22,0); tone(880,.22,.32); }
  else if(p==="walk"){ tone(440,.6,0); }
  else { tone(780,.3,0); tone(780,.3,.45); tone(780,.45,.9); tone(980,.5,1.5); }
}
async function lockScreen(){ try{ if(navigator.wakeLock) WL=await navigator.wakeLock.request("screen"); }catch(e){} }
function unlockScreen(){ try{ if(WL){ WL.release(); WL=null; } }catch(e){} }
document.addEventListener("visibilitychange",()=>{
  if(TMR && document.visibilityState==="visible"){
    lockScreen(); wakeAudio();
    /* sync to the correct phase silently — no catch-up beep */
    const el=tmrElapsed();
    if(el<TMR.total){ let idx=0; while(TMR.cum[idx]<=el) idx++; TMR.idx=idx; }
    tick();
  }
});

function startTimer(phases,mode){
  initAudio(); lockScreen();
  const cum=[]; let acc=0;
  for(const p of phases){ acc+=p.s; cum.push(acc); }
  TMR={phases,cum,mode,idx:0,rem:phases[0].s,t0:Date.now(),total:acc};
  cue(phases[0].p);

}
function tmrElapsed(){ return (Date.now()-TMR.t0)/1000; }
function tmrRanSec(){
  const el=Math.min(tmrElapsed(),TMR.total); let r=0,acc=0;
  for(let i=0;i<TMR.phases.length;i++){
    const st=acc, en=TMR.cum[i]; acc=en;
    if(TMR.phases[i].p==="run") r+=Math.max(0,Math.min(el,en)-st);
  }

}
function tick(){
  if(!TMR) return;
  wakeAudio();
  const el=tmrElapsed();
  if(el>=TMR.total){ finishTimer(); return; }
  let idx=0; while(TMR.cum[idx]<=el) idx++;
  if(idx!==TMR.idx){ TMR.idx=idx; cue(TMR.phases[idx].p); }
  if(TMR.mode==="rec" && S.session){
    let chg=false;
    for(let i=0;i<idx;i++){
      const p=TMR.phases[i];
      if(p.ex && !p.ck){ p.ck=true;
        const ent=S.session.entries[p.ex];
        if(ent && ent.sets[p.h] && !ent.sets[p.h].done){ ent.sets[p.h].done=true; chg=true; }
      }
    }
    if(chg) save();
  }
  TMR.rem=Math.ceil(TMR.cum[idx]-el);
  updTimer();
}
const fmtT = s => Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function updTimer(){
  const a=document.getElementById("tmrTime");
  if(!a){ return; }
  a.textContent=fmtT(TMR.rem);

    TMR.idx+1<TMR.phases.length ? "NEXT: "+TMR.phases[TMR.idx+1].l : "FINAL PHASE";

    }
    save(); go("workout");
  } else {
    if(S.session) S.session.timerDone=true;
    save(); go("workout");
  }
}

/* ---------- gate panel + schedule ---------- */
function gateLabel(pl){
  if(pl.t==="lift") return LIFTS[pl.key].name;
  if(pl.t==="cardio") return "ENDURANCE TRAINING";
  if(pl.t==="runsimple") return pl.name||"RUN";
  if(pl.t==="ph") return pl.name||"CUSTOM TRAINING";
  if(pl.t==="stretch") return SGATES[pl.key].name;
  if(pl.t==="pool") return "WEEKEND GATES";
  return "REST";
}
function gateKind(pl){
  if(pl.t==="lift") return "LIFT";
  if(pl.t==="cardio"||pl.t==="runsimple") return "CARDIO";
  if(pl.t==="ph") return "CUSTOM";
  if(pl.t==="pool") return "RUN / STRETCH";
  return pl.sch?"RECOVERY":"RECOVERY (optional)";
}

    inner=`<div class="qname">${sessTitle()}</div>

function bonusKeyFor(pl){
  if(pl.bon) return pl.bon;

  if(pl.t==="runsimple") return "runsimple";

}
function sessTitle(){
  const s=S.session;
  if(s.kind==="plan") return s.title||"COACH PLAN";

  if(s.kind==="cardio") return "ENDURANCE TRAINING";

  return "SESSION";
}

/* ---------- starting gates ---------- */
function poolAvail(i){ const ps=poolState(); return !ps.used[i]; }
function startPool(i){
  if(S.session){ go("workout"); return; }
  if(S.lastDone===todayStr()) return;
  if(!poolAvail(i)) return;
  const g=POOL_GATES[i];
  if(g.t==="cardio"){ S.session={kind:"cardio",source:"fallback",startedAt:new Date().toISOString(),level:Math.min(S.cardioLvl,CARDIO.length),pool:i}; }
  else { S.session=mkRecSession(g.key,true); S.session.pool=i; }
  save(); go("workout");
}
function mkRecSession(key,sched){
  const entries={};
  for(const e of stretchesFor(key)) entries[e.id]={sets:Array.from({length:recRows(e)},()=>({done:false,at:null}))};
  return {kind:"rec",source:"fallback",startedAt:new Date().toISOString(),key,entries,sched:!!sched};
}
function startGate(force){
  if(S.session){ go("workout"); return; }
  const gi=gateForToday(), pl=planFor(gi);
  if(!force && S.fastStart && fastHrs()>=14 && (pl.t==="lift"||pl.t==="cardio")){
    modal(`<h2>⚠ WARNING</h2><div>You are <b class="gold">${fastHrs().toFixed(1)} hours</b> into a fast.<br>
      <span class="muted" style="font-size:12px">Heavy training this deep into a fast costs strength and risks muscle on a cut. Eating first is the stronger play.</span></div>
      <button class="btn danger" onclick="closeModal();startGate(true)">ENTER ANYWAY</button>
      <button class="btn ghost" onclick="closeModal()">EAT FIRST</button>`);
    return;
  }
  if(S.lastDone===todayStr()){
    modal(`<h2>⚠ SYSTEM</h2><div>A gate was already cleared today.<br><span class="muted">One dungeon per day. It reopens tomorrow.</span></div><button class="btn" onclick="closeModal()">OK</button>`);
    return;
  }
  if(pl.t==="lift"){
    const v=S.gateV[pl.key]?1:0;
    const entries={};
    for(const e of liftsFor(pl.key,v)){
      const st=exSt(e.id);
      entries[e.id]={cal:!e.bw&&!st.calibrated,
        sets:Array.from({length:e.sets},()=>blankLiftSet(e, st))};
    }
    S.session={kind:"lift",source:"fallback",startedAt:new Date().toISOString(),key:pl.key,v,entries};
  } else if(pl.t==="cardio"){
    S.session={kind:"cardio",source:"fallback",startedAt:new Date().toISOString(),level:Math.min(S.cardioLvl,CARDIO.length)};
  } else if(pl.t==="runsimple"){
    S.session={kind:"runsimple",source:"fallback",startedAt:new Date().toISOString(),name:pl.name,desc:pl.desc};
  } else if(pl.t==="ph"){
    S.session={kind:"ph",source:"fallback",startedAt:new Date().toISOString(),name:pl.name,desc:pl.desc,sub:!!pl.sub};
  } else if(pl.t==="stretch"){
    S.session=mkRecSession(pl.key,pl.sch);
  } else return;
  save(); go("workout");
}
function startRecBonus(){
  if(S.session){ go("workout"); return; }
  const pl=planFor(gateForToday());
  const bk=bonusKeyFor(pl);
  if(!bk||!BONK[bk]||S.lastDone!==todayStr()||S.recBonusD===todayStr()) return;
  const entries={};
  for(const e of BONK[bk]) entries[e.id]={sets:Array.from({length:recRows(e)},()=>({done:false}))};
  S.session={kind:"rbonus",source:"fallback",startedAt:new Date().toISOString(),bk,entries};
  save(); go("workout");
}

function startRecTimer(){
  const lst=recList(S.session);

  lst.forEach((e)=>{
    const rows=recRows(e);
    for(let h=0;h<rows;h++){
      if(S.session.entries[e.id].sets[h].done) continue;
      const secs = e.mode==="reps" ? Math.max(30, recVal(e)*4) : recVal(e);
      const lbl = e.name.toUpperCase()
        + (e.per?(h===0?" — LEFT":" — RIGHT"):"")
        + (e.mode==="reps"?" ("+recVal(e)+" REPS)":"");
      ph.push({l:lbl, s:secs, p:"walk", ex:e.id, h:h});
      ph.push({l:"SWITCH · BREATHE", s:12, p:"run"});
    }
  });
  if(ph.length && ph[ph.length-1].p==="run") ph.pop();
  if(!ph.length){ modal(`<h2>⚠ SYSTEM</h2><div>Every stretch is already complete.</div><button class="btn" onclick="closeModal()">OK</button>`); return; }

function finishRec(){
  const sess=S.session, lst=recList(sess), bonus=sess.kind==="rbonus";

  for(const e of lst){

    structuredEx.push({exerciseId:e.id, sets:(sess.entries[e.id].sets||[]).map((s,i)=>({
      index:i,
      planned:{sec:e.mode==="reps"?null:plannedAmount, reps:e.mode==="reps"?plannedAmount:null},
      actual:{done:!!s.done, skipped:!s.done},
      loggedAt:s.at||null
    }))});
    if(d===recRows(e)){
      S.recN[e.id]=(S.recN[e.id]||0)+1;
      S.recMeta=S.recMeta||{};
      S.recMeta[e.id]=new Date().toISOString();
    }
    det.push(`${e.name}: ${d}/${recRows(e)} × ${recLbl(e)}`);
  }
  if(!done){ modal(`<h2>⚠ SYSTEM</h2><div>Nothing logged. Complete at least one stretch.</div><button class="btn" onclick="closeModal()">OK</button>`); return; }
  const all=done===total;
  let xp=(bonus?10:20)+(all?5:0);
  if(sess.payWork) xp=prof().workXP;
  S.recDone++;
  if(bonus){ S.recBonusD=todayStr(); }
  if(sess.pool!==undefined){ poolState().used[sess.pool]=true; save(); }
  const stretchDoc={
    source:"fallback", kind:bonus?"rbonus":"stretch", title:recTitle(sess), date:todayStr(),
    startedAt:sess.startedAt||null, exercises:structuredEx,
    blocks:structuredEx.map(x=>({type:"stretch", exerciseId:x.exerciseId, sets:x.sets}))
  };
  if(bonus){
    const entry={d:todayStr(), name:"RECOVERY BONUS", xp, det:det.join("\n")};
    S.log.unshift(entry);
    S.structLog=S.structLog||[];
    stretchDoc.id=todayStr()+"-bonus-"+Date.now().toString(36);
    stretchDoc.finishedAt=new Date().toISOString();
    stretchDoc.xp=xp;
    entry.id=stretchDoc.id;
    S.structLog.unshift(stretchDoc);
    S.session=null; gainXp(xp); save();
    if(window.Cloud && Cloud.writeSession) Cloud.writeSession(stretchDoc);
    modal(`<h2>⚠ BONUS CLEAR</h2><div class="big">+${xp} XP</div>
      <div class="muted">Flexibility is armor.</div>
      <button class="btn" onclick="finishClear()">COMPLETE</button>`);
    renderHeader();
  } else {
    sealSession(recTitle(sess), xp, det.join("\n"),
      `<div class="muted">Flexibility is armor. Targets increase next visit.</div>`,
      stretchDoc, lst.map(e=>({exerciseId:e.id, name:e.name})));
  }
}

/* ---------- stats ---------- */
/* Growth: weighted by each lift's own baseline (sum of gains / sum of bases) instead of
   averaging raw percentages, so one volatile accessory lift can't swing the number as much
   as a main lift. */
function growthPct(){
  let num=0,den=0;
  for(const id in S.ex){ const v=S.ex[id]; if(v.base>0&&v.best>0){ num+=(v.best-v.base); den+=v.base; } }
  return den? num/den : 0;
}
/* Current strength relative to bodyweight, using each lift's live working weight (which
   already drops on real regression via the deload-on-fail logic) — not the all-time e1RM PR,
   and not lifetime tonnage. Excludes bodyweight-only and assisted lifts (different scale). */
function currentStrengthRatio(){
  if(!S.weights.length) return null;
  const bw=S.weights[S.weights.length-1].lbs;
  if(!(bw>0)) return null;
  let sum=0,n=0;
  for(const id in S.ex){
    const v=S.ex[id]; if(!v.calibrated || !(v.weight>0)) continue;
    if(S.profile==="hunter" && id==="bss") continue;
    const d=exDef(id); if(!d || d.bw || d.assist) continue;
    sum+=v.weight/bw; n++;
  }
  return n? sum/n : null;
}
/* Rolling 30-day rate (0..1) of days on which a log entry matching `pred` exists. Used so
   VIT/DISCIPLINE/FLEX reflect recent behaviour, not a lifetime count that never comes down. */
function last30Rate(pred){
  const since=Date.now()-30*86400000;
  const days=new Set();
  for(const l of S.log){ if(pred(l)){ const t=new Date(l.d).getTime(); if(t>=since) days.add(l.d); } }
  return days.size/30;
}
function last30WeighRate(){
  const since=Date.now()-30*86400000;
  const days=new Set();
  for(const w of S.weights){ if(new Date(w.d).getTime()>=since) days.add(w.d); }
  return days.size/30;
}

function addWeight(){
  const v=parseNum(document.getElementById("win").value);
  if(!(v>0)) return;
  const t=todayStr();
  const existing=S.weights.find(w=>w.d===t);
  const stamped=new Date().toISOString();
  if(existing){ existing.lbs=v; existing.updatedAt=stamped; }
  else{
    S.weights.push({d:t,lbs:v,updatedAt:stamped});
    if(S.lastWeighXp!==t){
      S.lastWeighXp=t;
      const prev=S.weights.length>1?S.weights[S.weights.length-2].lbs:null;
      const bonus=(prev!==null && v<prev)?15:0;
      gainXp(10+bonus);
      if(bonus) modal(`<h2>⚠ NOTIFICATION</h2><div>Weigh-in logged.<br><b class="good">Weight down — +${10+bonus} XP</b></div><button class="btn" onclick="closeModal()">OK</button>`);
    }
  }
  save(); vWeight(); renderHeader();
}
function movAvg(ws){
  return ws.map((_,i)=>{
    const win=ws.slice(Math.max(0,i-6), i+1);
    return win.reduce((a,w)=>a+w.lbs,0)/win.length;
  });
}
function drawChart(ws){
  if(ws.length<2) return "";
  const W=480,H=170,P=26;
  const ma=movAvg(ws);
  const vals=ws.map(w=>w.lbs).concat(ma);
  let mn=Math.min(...vals), mx=Math.max(...vals);
  if(mx-mn<2){mx+=1;mn-=1;}
  const X=i=>P+ i*(W-2*P)/(ws.length-1);
  const Y=v=>H-P-(v-mn)*(H-2*P)/(mx-mn);
  const raw=ws.map((w,i)=>`${X(i).toFixed(1)},${Y(w.lbs).toFixed(1)}`).join(" ");
  const trend=ma.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  const dots=ws.map((w,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(w.lbs).toFixed(1)}" r="2" fill="var(--pb)" opacity="0.45"/>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="rgba(var(--prgb),.35)"/>
    <text x="${P}" y="${Y(Math.max(...vals))-6}" fill="var(--dim)" font-size="10">${Math.round(mx)}</text>
    <text x="${P}" y="${Y(Math.min(...vals))+13}" fill="var(--dim)" font-size="10">${Math.round(mn)}</text>
    <polyline points="${raw}" fill="none" stroke="var(--p)" stroke-width="1.2" opacity="0.35"/>
    ${dots}
    <polyline points="${trend}" fill="none" stroke="var(--p)" stroke-width="2.6" style="filter:drop-shadow(0 0 5px var(--p))"/>
  </svg>`;
}

}
function resetAll(){
  modal(`<h2>⚠ WARNING</h2><div>Erase ALL progress, history and calibration on this device?<br><span class="muted">This cannot be undone. A signed-in cloud copy is left in place and you are signed out, so an empty log is not uploaded over it.</span></div>
    <button class="btn danger" onclick="if(window.Cloud&&Cloud.pausePush)Cloud.pausePush();S=defaultState();persist();if(window.Cloud&&Cloud.signOut)Cloud.signOut();closeModal();renderHeader();go('quest')">ERASE EVERYTHING</button>
    <button class="btn ghost" onclick="closeModal()">CANCEL</button>`);
}

/* ---------- boot ---------- */
const VIEWS={quest:vQuest, workout:vWorkout, stats:vStats, weight:vWeight, log:vLog, sys:vSys};
applyTheme(); renderHeader(); renderNav();
if(!S.tz){ try{ S.tz=Intl.DateTimeFormat().resolvedOptions().timeZone; }catch(e){} }
if(window.Cloud){
  Cloud.onChange=function(){
    const ovl=document.getElementById("ovl");
    if(ovl && ovl.classList.contains("show")) return;
    if(S.session && curView==="workout") return;
    if(curView==="intake") return;
    if(curView==="quest") vQuest();
    else if(curView==="sys") vSys();
    maybeOfferIntake();
  };
  Cloud.start();
}
if(S.session) go("workout"); else go("quest");
if(!S.name) askName(true);
pushLB();
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  navigator.serviceWorker.register("./sw.js").catch(function(){});
}
</script>
</body>
</html>
