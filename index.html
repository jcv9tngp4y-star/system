<style>
:root{
  --p:#b16cff; --pb:#d8b4fe; --pd:#7b2cbf; --pdim:#5a189a;
  --bg:#05030b; --panel:rgba(9,5,20,.93); --panel2:rgba(18,9,38,.72);
  --txt:#efe6ff; --dim:#9f8bc9; --good:#4ade80; --bad:#f87171; --gold:#fbbf24;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background-image:
    radial-gradient(ellipse at 50% -10%, rgba(123,44,191,.25), transparent 60%),
    radial-gradient(ellipse at 80% 110%, rgba(90,24,154,.2), transparent 55%);
  background-attachment:fixed;
  overscroll-behavior:none;
}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:76px}
header{
  padding:14px 14px 10px; display:flex;align-items:center;gap:12px;
  border-bottom:1px solid rgba(177,108,255,.35);
  background:linear-gradient(180deg,rgba(46,16,84,.6),transparent);
}
.lvlbox{
  width:54px;height:54px;flex:0 0 54px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:1px solid var(--p); background:rgba(8,4,18,.6); position:relative;
  box-shadow:0 0 14px rgba(177,108,255,.5), inset 0 0 12px rgba(177,108,255,.22);
}
.lvlbox::before{content:"";position:absolute;inset:3px;border:1px solid rgba(177,108,255,.3);pointer-events:none}
.lvlbox small{font-size:8px;letter-spacing:2px;color:var(--dim)}
.lvlbox b{font-size:22px;color:#fff;text-shadow:0 0 8px var(--p);line-height:1}
.hmeta{flex:1;min-width:0}
.hname{font-size:12px;letter-spacing:3px;color:var(--pb);font-weight:600}
.hrank{font-size:10px;letter-spacing:2px;color:var(--dim);margin-top:2px}
.hrank b{color:var(--gold);text-shadow:0 0 6px rgba(251,191,36,.6)}
.xpbar{margin-top:6px;height:8px;border:1px solid rgba(177,108,255,.5);background:rgba(0,0,0,.4);position:relative}
.xpfill{height:100%;background:linear-gradient(90deg,var(--pd),var(--pb));box-shadow:0 0 8px var(--p);transition:width .4s}
.xptxt{font-size:9px;color:var(--dim);letter-spacing:1px;margin-top:3px;text-align:right}
.streak{font-size:10px;letter-spacing:1px;color:var(--pb);text-align:right;white-space:nowrap}
.streak b{color:#fff;font-size:16px;text-shadow:0 0 8px var(--p)}
main{flex:1;padding:14px}
.panel{
  border:1px solid rgba(177,108,255,.85); margin-bottom:16px; position:relative;
  background:
    linear-gradient(rgba(177,108,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(177,108,255,.045) 1px,transparent 1px),
    var(--panel);
  background-size:22px 22px,22px 22px,auto;
  box-shadow:0 0 22px rgba(177,108,255,.35), 0 0 60px rgba(123,44,191,.15), inset 0 0 34px rgba(90,24,154,.22);
  animation:pin .25s ease-out;
}
.panel::before{content:"";position:absolute;inset:4px;border:1px solid rgba(177,108,255,.28);pointer-events:none;z-index:1}
.panel::after{
  content:"";position:absolute;top:-3px;left:14px;right:14px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(216,180,254,.9),transparent);
  filter:drop-shadow(0 0 4px var(--p));pointer-events:none;
}
.pbody,.ptitle{position:relative;z-index:2}
@keyframes pin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ptitle{
  display:flex;align-items:center;justify-content:center;gap:12px;padding:13px 14px;
  border-bottom:1px solid rgba(177,108,255,.35);
  font-size:14px;letter-spacing:7px;font-weight:300;color:#fff;text-shadow:0 0 10px var(--p),0 0 26px rgba(177,108,255,.7);
  text-transform:uppercase;
}
.diamond{
  width:24px;height:24px;flex:0 0 24px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:14px;font-weight:600;background:transparent;border:2px solid #fff;border-radius:50%;
  box-shadow:0 0 12px var(--p), inset 0 0 8px rgba(177,108,255,.55);text-shadow:0 0 6px var(--p);
}
.diamond span{display:block;line-height:1;transform:translateY(-0.5px)}
.diamond span.gear{transform:translate(0,-1.5px);font-size:12px}
.pbody{padding:14px}
.qname{font-size:20px;letter-spacing:3px;color:#fff;text-shadow:0 0 12px var(--p);text-align:center;margin:6px 0 2px;font-weight:700}
.qsub{text-align:center;color:var(--dim);font-size:11px;letter-spacing:2px;margin-bottom:12px}
.goalrow{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px dashed rgba(177,108,255,.25);font-size:13px}
.goalrow .gname{color:var(--txt)}
.goalrow .gval{color:var(--pb)}
.warn{color:var(--bad);font-size:10px;letter-spacing:1px;text-align:center;margin-top:12px}
.btn{
  display:block;width:100%;padding:13px;margin-top:12px;cursor:pointer;
  background:rgba(8,4,18,.55);
  border:1px solid var(--p);color:#fff;font-size:13px;letter-spacing:5px;font-weight:400;
  font-family:inherit;text-shadow:0 0 8px var(--p),0 0 20px rgba(177,108,255,.6);
  box-shadow:0 0 14px rgba(177,108,255,.4), inset 0 0 14px rgba(177,108,255,.14);
}
.btn:active{background:rgba(123,44,191,.45)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--pb);border-color:rgba(177,108,255,.5)}
.btn.danger{border-color:var(--bad);color:var(--bad);text-shadow:none;background:rgba(248,113,113,.08);box-shadow:none}
.excard{border:1px solid rgba(177,108,255,.45);background:var(--panel2);margin-bottom:12px;padding:10px 12px}
.exhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.exname{font-size:14px;font-weight:600;color:#fff;letter-spacing:1px}
.extag{font-size:10px;color:var(--dim);letter-spacing:1px;white-space:nowrap}
.caltag{color:var(--gold);font-size:9px;letter-spacing:2px;border:1px solid rgba(251,191,36,.5);padding:2px 6px;display:inline-block;margin-bottom:8px}
.setrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed rgba(177,108,255,.2)}
.setnum{width:20px;flex:0 0 20px;text-align:center;font-size:11px;color:var(--dim)}
.setrow.done .setnum{color:var(--good)}
.wtag{min-width:70px;font-size:13px;color:var(--pb);font-weight:600}
.wtag small{font-size:9px;color:var(--dim)}
.repctl{display:flex;align-items:center;gap:2px;margin-left:auto}
.repctl button{
  width:32px;height:32px;background:rgba(123,44,191,.25);border:1px solid rgba(177,108,255,.5);
  color:var(--pb);font-size:14px;cursor:pointer;font-family:inherit;
}
.repctl .rv{width:34px;text-align:center;font-size:15px;color:#fff}
.chk{
  width:40px;height:34px;flex:0 0 40px;margin-left:6px;cursor:pointer;
  background:rgba(0,0,0,.35);border:1px solid rgba(177,108,255,.5);color:transparent;font-size:16px;font-family:inherit;
}
.setrow.done .chk{background:rgba(74,222,128,.18);border-color:var(--good);color:var(--good)}
.cin{
  width:64px;padding:7px 4px;background:rgba(0,0,0,.4);border:1px solid rgba(177,108,255,.5);
  color:#fff;font-size:15px;text-align:center;font-family:inherit;border-radius:0;
}
.cin:focus{outline:none;border-color:var(--pb);box-shadow:0 0 8px rgba(177,108,255,.4)}
.logbtn{
  margin-left:auto;padding:7px 12px;background:rgba(123,44,191,.35);border:1px solid var(--p);
  color:#fff;font-size:11px;letter-spacing:2px;cursor:pointer;font-family:inherit;
}
.setrow.done .logbtn{border-color:var(--good);color:var(--good);background:rgba(74,222,128,.1)}
.xmark{font-size:12px;color:var(--dim)}
.cbig{text-align:center;font-size:36px;color:#fff;text-shadow:0 0 14px var(--p);margin:8px 0;font-weight:700}
.intv{display:flex;justify-content:space-between;padding:8px 6px;border-bottom:1px dashed rgba(177,108,255,.25);font-size:13px}
.tmrbig{font-size:64px;text-align:center;color:#fff;text-shadow:0 0 24px var(--p),0 0 60px rgba(177,108,255,.5);font-weight:300;letter-spacing:4px;margin:14px 0}
.phaselbl{text-align:center;font-size:19px;letter-spacing:7px;color:var(--pb);text-shadow:0 0 12px var(--p);margin-top:8px}
.nextlbl{text-align:center;font-size:10px;letter-spacing:2px;color:var(--dim);margin-top:4px}

  p.timed.forEach(tm=>items.push({n:tm.n, unit:"min", g:dqTimedTarget(tm), kind:tm.kind, dist:tm.dist&&dqTimedTarget(tm)>=tm.cap}));
  return items;

function checkPenalty(){
  const t=todayStr();
  const y=new Date(); y.setDate(y.getDate()-1);
  const yStr=y.toLocaleDateString("en-CA");
  const anchor=[S.daily.lastComplete,S.daily.penClear].filter(Boolean).sort().pop();
  if(!S.daily.penalty && anchor && anchor<yStr){
    const gap=dayDiff(anchor,t);
    S.daily.penalty=true; S.streak=0;
    if(gap>=7){
      const before=S.daily.count;
      S.daily.count=Math.max(0,S.daily.count-2*(gap-6));
      if(S.daily.count<before) S.decayNote=`EXTENDED ABSENCE — ${gap} DAYS. DAILY TARGETS RECALIBRATED DOWNWARD.`;
    }
    save();
  }
}

/* ---------- audio + timer ---------- */
let ACTX=null, WL=null, TMR=null;
function initAudio(){
  try{ if(!ACTX) ACTX=new (window.AudioContext||window.webkitAudioContext)(); if(ACTX.state==="suspended") ACTX.resume(); }catch(e){}
}
function tone(f,d,off){
  if(!ACTX) return;
  try{
    const o=ACTX.createOscillator(), g=ACTX.createGain();
    o.type="sine"; o.frequency.value=f; o.connect(g); g.connect(ACTX.destination);
    const t=ACTX.currentTime+off;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.9,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.start(t); o.stop(t+d+0.05);
  }catch(e){}
}
function wakeAudio(){ try{ if(ACTX&&ACTX.state!=="running") ACTX.resume(); }catch(e){} }
function cue(p){
  wakeAudio();
  if(p==="run"){ tone(880,.22,0); tone(880,.22,.32); }
  else if(p==="walk"){ tone(440,.6,0); }
  else { tone(780,.3,0); tone(780,.3,.45); tone(780,.45,.9); tone(980,.5,1.5); }
}
async function lockScreen(){ try{ if(navigator.wakeLock) WL=await navigator.wakeLock.request("screen"); }catch(e){} }
function unlockScreen(){ try{ if(WL){ WL.release(); WL=null; } }catch(e){} }
document.addEventListener("visibilitychange",()=>{
  if(TMR && document.visibilityState==="visible"){
    lockScreen(); wakeAudio();
    /* sync to the correct phase silently — no catch-up beep */
    const el=tmrElapsed();
    if(el<TMR.total){ let idx=0; while(TMR.cum[idx]<=el) idx++; TMR.idx=idx; }
    tick();
  }
});

function startTimer(phases,mode){
  initAudio(); lockScreen();
  const cum=[]; let acc=0;
  for(const p of phases){ acc+=p.s; cum.push(acc); }
  TMR={phases,cum,mode,idx:0,rem:phases[0].s,t0:Date.now(),total:acc};
  cue(phases[0].p);
  TMR.int=setInterval(tick,500);
  vTimer();
}
function tmrElapsed(){ return (Date.now()-TMR.t0)/1000; }
function tmrRanSec(){
  const el=Math.min(tmrElapsed(),TMR.total); let r=0,acc=0;
  for(let i=0;i<TMR.phases.length;i++){
    const st=acc, en=TMR.cum[i]; acc=en;
    if(TMR.phases[i].p==="run") r+=Math.max(0,Math.min(el,en)-st);
  }
  return r;
}
function tick(){
  if(!TMR) return;
  wakeAudio();
  const el=tmrElapsed();
  if(el>=TMR.total){ finishTimer(); return; }
  let idx=0; while(TMR.cum[idx]<=el) idx++;
  if(idx!==TMR.idx){ TMR.idx=idx; cue(TMR.phases[idx].p); }
  if(TMR.mode==="rec" && S.session){
    let chg=false;
    for(let i=0;i<idx;i++){
      const p=TMR.phases[i];
      if(p.ex && !p.ck){ p.ck=true;
        const ent=S.session.entries[p.ex];
        if(ent && ent.sets[p.h] && !ent.sets[p.h].done){ ent.sets[p.h].done=true; chg=true; }
      }
    }
    if(chg) save();
  }
  TMR.rem=Math.ceil(TMR.cum[idx]-el);
  updTimer();
}
const fmtT = s => Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function updTimer(){
  const a=document.getElementById("tmrTime");
  if(!a){ return; }
  a.textContent=fmtT(TMR.rem);
  document.getElementById("tmrPhase").textContent=TMR.phases[TMR.idx].l;
  document.getElementById("tmrNext").textContent =
    TMR.idx+1<TMR.phases.length ? "NEXT: "+TMR.phases[TMR.idx+1].l : "FINAL PHASE";
}
function vTimer(){
  if(!TMR){ go("quest"); return; }
  document.getElementById("view").innerHTML=`
    <div class="panel"><div class="ptitle"><div class="diamond"><span>!</span></div>GUIDED TRAINING</div>
      <div class="pbody" style="text-align:center">
        <div class="phaselbl" id="tmrPhase">${TMR.phases[TMR.idx].l}</div>
        <div class="tmrbig" id="tmrTime">${fmtT(TMR.rem)}</div>
        <div class="nextlbl" id="tmrNext"></div>
        <div class="muted" style="font-size:10px;margin-top:10px">Keep this screen open — cues beep at every phase change.<br>2 short beeps = run · 1 long = walk · 3 = finished</div>
        <button class="btn danger" onclick="stopTimer()">STOP — PROGRESS IS SAVED</button>
      </div></div>`;
  updTimer();
}
function stopTimer(){
  if(!TMR) return;
  clearInterval(TMR.int); unlockScreen();
  const mode=TMR.mode, di=TMR.di;
  const mins=Math.floor(Math.min(tmrElapsed(),TMR.total)/60);
  TMR=null;
  if(mode==="daily" && mins>0 && di!=null && S.daily.lastComplete!==todayStr()){
    const g=dailyGoals();
    S.daily.parts[di]=Math.min(g[di],(S.daily.parts[di]||0)+mins); save();
  }
  if(mode==="daily"){ go("quest"); } else { go("workout"); }
}
function finishTimer(){
  clearInterval(TMR.int); cue("done"); unlockScreen();
  const mode=TMR.mode, phs=TMR.phases, TMRdi=TMR.di;
  const ranMin=Math.max(1,Math.round(Math.min(tmrElapsed(),TMR.total)/60));
  TMR=null;
  if(mode==="daily"){
    const di=TMRdi; const g=dailyGoals();
    if(di!=null && S.daily.lastComplete!==todayStr()){
      S.daily.parts[di]=Math.min(g[di],(S.daily.parts[di]||0)+ranMin); save();
    }
    const done = S.daily.parts.every((v,j)=>v>=g[j]);
    if(done && S.daily.lastComplete!==todayStr()){ completeDaily(); }
    else modal(`<h2>⚠ SYSTEM</h2><div class="good">Segment complete — ${ranMin} min credited.</div>
      <button class="btn" onclick="closeModal();go('quest')">COMPLETE</button>`);
  } else if(mode==="rec"){
    if(S.session){
      for(const p of phs){ if(p.ex && S.session.entries[p.ex] && S.session.entries[p.ex].sets[p.h]) S.session.entries[p.ex].sets[p.h].done=true; }
    }
    save(); go("workout");
  } else {
    if(S.session) S.session.timerDone=true;
    save(); go("workout");
  }
}

function poolAvail(i){ const ps=poolState(); return !ps.used[i]; }
function startPool(i){
  if(S.session){ go("workout"); return; }
  if(S.lastDone===todayStr()) return;
  if(!poolAvail(i)) return;
  const g=POOL_GATES[i];
  if(g.t==="cardio"){ S.session={kind:"cardio",level:Math.min(S.cardioLvl,CARDIO.length),pool:i}; }
  else { S.session=mkRecSession(g.key,true); S.session.pool=i; }
  save(); go("workout");
}
function mkRecSession(key,sched){
  const entries={};
  for(const e of SGATES[key].ex) entries[e.id]={sets:Array.from({length:recRows(e)},()=>({done:false}))};
  return {kind:"rec",key,entries,sched:!!sched};
}
function startGate(){
  if(S.session){ go("workout"); return; }
  const gi=gateForToday(), pl=planFor(gi);
  if(S.lastDone===todayStr()){
    modal(`<h2>⚠ SYSTEM</h2><div>A gate was already cleared today.<br><span class="muted">One dungeon per day. It reopens tomorrow.</span></div><button class="btn" onclick="closeModal()">OK</button>`);
    return;
  }
  if(pl.t==="lift"){
    const v=S.gateV[pl.key]?1:0;
    const entries={};
    for(const e of exListK(pl.key,v)){
      const st=exSt(e.id);
      const wq = e.bw ? 0 : (st.calibrated ? (isDeload()? deloadW(st.weight):st.weight) : 0);
      entries[e.id]={cal:!e.bw&&!st.calibrated,
        sets:Array.from({length:e.sets},()=>({w:wq,r:(e.bw||st.calibrated)?e.hi:0,done:false}))};
    }
    S.session={kind:"lift",key:pl.key,v,entries};
  } else if(pl.t==="cardio"){
    S.session={kind:"cardio",level:Math.min(S.cardioLvl,CARDIO.length)};
  } else if(pl.t==="runsimple"){
    S.session={kind:"runsimple",name:pl.name,desc:pl.desc};
  } else if(pl.t==="ph"){
    S.session={kind:"ph",name:pl.name,desc:pl.desc};
  } else if(pl.t==="stretch"){
    S.session=mkRecSession(pl.key,pl.sch);
  } else return;
  save(); go("workout");
}
function startRecBonus(){
  if(S.session){ go("workout"); return; }
  const pl=planFor(gateForToday());
  const bk=bonusKeyFor(pl);
  if(!bk||!BONK[bk]||S.lastDone!==todayStr()||S.recBonusD===todayStr()) return;
  const entries={};
  for(const e of BONK[bk]) entries[e.id]={sets:Array.from({length:recRows(e)},()=>({done:false}))};
  S.session={kind:"rbonus",bk,entries};
  save(); go("workout");
}

/* ---------- workout views ---------- */

  if(!S.session){ go("quest"); return; }
  const k=S.session.kind;
  if(k==="cardio"){ vCardioSession(); return; }
  if(k==="rec"||k==="rbonus"){ vRecSession(); return; }
  if(k==="runsimple"||k==="ph"){ vSimpleGate(); return; }
  const key=S.session.key, v=S.session.v?1:0;
  const lst=exListK(key,v);
  const cards=lst.map(e=>{
    const ent=S.session.entries[e.id];
    const rows=ent.sets.map((s,i)=> ent.cal ? `
      <div class="setrow ${s.done?'done':''}" >
        <span class="setnum">${i+1}</span>
        <input class="cin" type="number" inputmode="decimal" placeholder="${e.assist?"±lb":"lb"}" id="cw-${e.id}-${i}" value="${s.w||''}">
        <span class="xmark">lb ×</span>
        <input class="cin" type="number" inputmode="numeric" placeholder="reps" id="cr-${e.id}-${i}" value="${s.r||''}">
        <button class="logbtn" onclick="logCal('${e.id}',${i})">${s.done?"✓ SET":"LOG"}</button>
      </div>` : `
      <div class="setrow ${s.done?'done':''}">
        <span class="setnum">${i+1}</span>
        <span class="wtag" onclick="editW('${e.id}',${i})">${e.bw?"body":fw(s.w)}<small> ${e.bw?"":"✎"}</small></span>
        <div class="repctl">
          <button onclick="adjR('${e.id}',${i},-1)">−</button>
          <span class="rv">${s.r}</span>
          <button onclick="adjR('${e.id}',${i},1)">+</button>
        </div>
        <button class="chk" onclick="togSet('${e.id}',${i})">✓</button>
      </div>`).join("");
    return `<div class="excard">
      <div class="exhead"><span class="exname">${e.name}</span>
        <span class="extag">${e.sets}×${e.lo}–${e.hi}${e.note?" · "+e.note:""}</span></div>
      ${ent.cal?`<span class="caltag">⚠ CALIBRATION — ${e.assist?"log assist as negative (e.g. -40)":"find a weight you can lift "+e.lo+"–"+e.hi+" times"}, log every set</span>`:""}
      ${rows}
    </div>`;
  }).join("");
  let wuHtml="";
  const dyn=WARMK[key];
  const firstEx=lst.find(e=>!e.bw), st0=firstEx?exSt(firstEx.id):null;
  if(dyn){
    if(!S.session.wu) S.session.wu=[false,false,false];
    const rows=[dyn[0],dyn[1]];
    if(st0&&st0.calibrated&&st0.weight>0){
      const W0=isDeload()? deloadW(st0.weight):st0.weight;
      rows.push(`${firstEx.name} — ${Math.max(5,Math.round(W0*0.6/5)*5)} lb × 8 (light)`);
    }
    wuHtml=`<div class="excard" style="border-color:rgba(251,191,36,.5)">
      <div class="exhead"><span class="exname" style="color:var(--gold)">WARM-UP</span><span class="extag">~2 min</span></div>
      ${rows.map((n,i)=>`
      <div class="setrow ${S.session.wu[i]?'done':''}">
        <span class="setnum">${S.session.wu[i]?"✓":i+1}</span>
        <span class="gname" style="flex:1;font-size:13px">${n}</span>
        <button class="chk" onclick="togWu(${i})">✓</button>
      </div>`).join("")}
    </div>`;
  }
  document.getElementById("view").innerHTML=`
    <div class="panel"><div class="ptitle"><div class="diamond"><span>!</span></div>${sessTitle()}</div>
      <div class="pbody">${wuHtml}${cards}
        <button class="btn" onclick="finishQuest()">CLEAR DUNGEON</button>
        <button class="btn ghost" onclick="go('quest')">◂ BACK (progress saved)</button>

}

function togWu(i){
  if(!S.session.wu) S.session.wu=[false,false,false];
  S.session.wu[i]=!S.session.wu[i];
  if(S.session.wu[i] && !(S.session.wuc&&S.session.wuc[i])){
    S.session.wuc=S.session.wuc||[false,false,false];
    S.session.wuc[i]=true;
    const p=prof(), dyn=WARMK[S.session.key]||[];
    const label=(dyn[i]||"").toLowerCase();
    p.reps.forEach((rn,ri)=>{
      const r=rn.toLowerCase();
      if((r.includes("push")&&label.includes("push"))){ addDailyCredit(ri,10); }
      if((r.includes("squat")&&label.includes("squat"))){ addDailyCredit(ri,15); }
      if((r.includes("bridge")&&label.includes("bridge"))){ addDailyCredit(ri,15); }
    });
  }
  save(); vWorkout();
}
function addDailyCredit(idx,n){
  if(S.daily.lastComplete===todayStr()) return;
  const g=dailyGoals();
  S.daily.parts[idx]=Math.min(g[idx], (S.daily.parts[idx]||0)+n); save();
}
function logCal(id,i){
  const e=exDef(id);
  const w=parseFloat(document.getElementById(`cw-${id}-${i}`).value);
  const r=parseInt(document.getElementById(`cr-${id}-${i}`).value);
  const wOk = e&&e.assist ? isFinite(w) : (w>0);
  if(!wOk||!(r>0)){ modal(`<h2>⚠ SYSTEM</h2><div>Enter the weight and reps you performed, then press LOG.${e&&e.assist?"<br><span class='muted'>Assisted: enter assist as a negative number.</span>":""}</div><button class="btn" onclick="closeModal()">OK</button>`); return; }
  const s=S.session.entries[id].sets[i]; s.w=w; s.r=r; s.done=true; save(); vWorkout();
}
function togSet(id,i){ const s=S.session.entries[id].sets[i]; s.done=!s.done; save(); vWorkout(); }
function adjR(id,i,d){ const s=S.session.entries[id].sets[i]; s.r=Math.max(0,Math.min(60,s.r+d)); s.done=true; save(); vWorkout(); }
function editW(id,i){
  const e=exDef(id); if(e&&e.bw) return;
  const s=S.session.entries[id].sets[i];
  const v=prompt("Weight for this set (lb, negative = assist):", s.w);
  if(v===null) return; const w=parseFloat(v);
  if(isFinite(w)){ s.w=w; save(); vWorkout(); }
}
function finishQuest(){
  const key=S.session.key, v=S.session.v?1:0;
  const lst=exListK(key,v);
  let setsDone=0, setsTotal=0, ton=0, det=[], progNotes=[];
  for(const e of lst){
    const ent=S.session.entries[e.id], st=exSt(e.id);
    const done=ent.sets.filter(s=>s.done);
    setsTotal+=e.sets; setsDone+=done.length;
    if(!done.length){ det.push(`${e.name}: skipped`); continue; }
    ton += done.reduce((a,s)=>a+Math.max(0,s.w)*s.r,0);
    det.push(`${e.name}: `+done.map(s=>`${e.bw?"":s.w+"×"}${s.r}`).join(", "));
    if(e.bw){
      const minReps=Math.min(...done.map(s=>s.r));
      if(done.length===e.sets && minReps>=e.hi) progNotes.push(`${e.name}: <b class="good">max reps — keep pushing</b>`);
      else progNotes.push(`${e.name}: build toward ${e.hi} reps`);
      st.calibrated=true;
      continue;
    }
    const bestSet=done.reduce((a,s)=>e1rm(s.w,s.r)>e1rm(a.w,a.r)?s:a);
    const best1=e1rm(bestSet.w,bestSet.r);
    if(bestSet.w>0 && best1>st.best) st.best=Math.round(best1);
    if(ent.cal){
      if(e.assist){ st.weight=round5a(Math.max(...done.map(s=>s.w))); }
      else { st.weight=round5(best1*0.95/(1+e.hi/30)); st.base=Math.round(best1); }
      st.calibrated=true; st.fails=0;
      progNotes.push(`${e.name}: calibrated → <b class="good">${fw(st.weight)}</b>`);
    } else if(isDeload()){
      progNotes.push(`${e.name}: deload week — held at ${fw(st.weight)}`);
    } else {
      const minReps=Math.min(...done.map(s=>s.r));
      if(done.length===e.sets && minReps>=e.hi){
        st.weight+=e.inc; st.fails=0;
        progNotes.push(`${e.name}: <b class="good">+${e.inc} lb → ${fw(st.weight)}</b>`);
      } else if(minReps<e.lo){
        st.fails=(st.fails||0)+1;
        if(st.fails>=2){
          st.weight = e.assist ? round5a(st.weight-10) : round5(st.weight*0.9);
          st.fails=0;
          progNotes.push(`${e.name}: deload → ${fw(st.weight)}`);
        } else progNotes.push(`${e.name}: hold at ${fw(st.weight)}`);
      } else progNotes.push(`${e.name}: hold — push for ${e.hi} reps`);
    }
  }
  if(!setsDone){ modal(`<h2>⚠ SYSTEM</h2><div>No sets logged. Complete at least one set.</div><button class="btn" onclick="closeModal()">OK</button>`); return; }
  if(LIFTS[key].ab.length>1) S.gateV[key]=S.gateV[key]?0:1;
  S.tonnage+=ton; S.quests++;
  completeCommon(sessTitle(), prof().workXP, det.join("\n"),
    `<div class="muted" style="text-align:left;font-size:12px;line-height:1.9">${progNotes.join("<br>")}</div>
     <div style="margin-top:10px">Volume moved: <b class="gold">${Math.round(ton).toLocaleString()} lb</b></div>`);
}

/* ---------- cardio / recovery sessions ---------- */
function vCardioSession(){
  if(TMR){ vTimer(); return; }
  const lvl=S.session.level, c=CARDIO[lvl-1];
  const tot=Math.round((c.run+c.walk)*c.rounds)+10;
  const ivs = c.walk
    ? `<div class="intv"><span>Warm-up walk</span><span class="gval">5 min</span></div>
       <div class="intv"><span>RUN ${c.run} min → WALK ${c.walk} min</span><span class="gval">repeat × ${c.rounds}</span></div>
       <div class="intv"><span>Cool-down walk</span><span class="gval">5 min</span></div>`
    : `<div class="intv"><span>Warm-up walk</span><span class="gval">5 min</span></div>
       <div class="intv"><span>RUN — continuous</span><span class="gval">${c.run} min</span></div>
       <div class="intv"><span>Cool-down walk</span><span class="gval">5 min</span></div>`;
  document.getElementById("view").innerHTML=`
    <div class="panel"><div class="ptitle"><div class="diamond"><span>!</span></div>ENDURANCE — LEVEL ${lvl}</div>
      <div class="pbody">
        <div class="cbig">≈ ${tot} MIN</div>
        ${ivs}
        ${S.session.timerDone?`<div class="clearbanner">✓ GUIDED SESSION FINISHED — REPORT RESULT</div>`:`
        <button class="btn" onclick="startCardioTimer()">▶ START GUIDED TIMER (BEEPS)</button>
        <div class="muted" style="font-size:10px;text-align:center;margin-top:8px">Keep the screen on. Or do it manually and report below.</div>`}
        <button class="btn ${S.session.timerDone?"":"ghost"}" onclick="finishCardio(true)">CLEARED — IT WAS MANAGEABLE</button>
        <button class="btn ghost" onclick="finishCardio(false)">CLEARED — BARELY SURVIVED</button>
        <button class="btn ghost" onclick="go('quest')">◂ BACK</button>
      </div></div>`;
}
function startCardioTimer(){
  const c=CARDIO[S.session.level-1];
  const ph=[{l:"WARM-UP WALK",s:300,p:"walk"}];
  for(let r=0;r<c.rounds;r++){
    ph.push({l:"RUN",s:Math.round(c.run*60),p:"run"});
    if(c.walk) ph.push({l:"WALK",s:Math.round(c.walk*60),p:"walk"});
  }
  ph.push({l:"COOL-DOWN WALK",s:300,p:"walk"});
  startTimer(ph,"cardio");
}
function finishCardio(advance){
  const lvl=S.session.level, c=CARDIO[lvl-1], wasPool=S.session.pool;
  let note;
  if(advance && S.cardioLvl<CARDIO.length){ S.cardioLvl++; note=`Endurance level up → <b class="good">LEVEL ${S.cardioLvl}</b>`; }
  else if(advance){ note=`<b class="good">Max program level.</b> Go further or faster.`; }
  else note=`Level held at ${lvl}. Clear it again to advance.`;
  S.cardioDone++;
  creditRun(Math.round(c.run*c.rounds));
  if(wasPool!==undefined){ poolState().used[wasPool]=true; save(); }
  completeCommon("ENDURANCE TRAINING", prof().workXP, `Run/walk level ${lvl} completed`, `<div class="muted">${note}</div>`);
}
function recList(sess){ return sess.kind==="rbonus" ? BONK[sess.bk] : SGATES[sess.key].ex; }
function recTitle(sess){ return sess.kind==="rbonus" ? "RECOVERY BONUS" : SGATES[sess.key].name; }
function vRecSession(){
  if(TMR){ vTimer(); return; }
  const lst=recList(S.session);
  const cards=lst.map(e=>{
    const ent=S.session.entries[e.id];
    const rows=ent.sets.map((s,i)=>`
      <div class="setrow ${s.done?'done':''}">
        <span class="setnum">${s.done?"✓":i+1}</span>
        <span class="gname" style="flex:1;font-size:13px">${e.mode==="reps"?"Set":"Hold"} ${i+1} — ${recLbl(e)}${e.alt?" total · alternating":e.per?(i===0?" · LEFT side":" · RIGHT side"):" · both sides"}</span>
        <button class="chk" onclick="togRec('${e.id}',${i})">✓</button>
      </div>`).join("");
    return `<div class="excard">
      <div class="exhead"><span class="exname">${e.name}</span><span class="extag">${sideTxt(e)}</span></div>
      ${e.tip?`<div class="muted" style="font-size:10px;margin-bottom:4px">${e.tip}</div>`:""}
      ${rows}</div>`;
  }).join("");
  document.getElementById("view").innerHTML=`
    <div class="panel"><div class="ptitle"><div class="diamond"><span>!</span></div>${recTitle(S.session)}</div>
      <div class="pbody">
        <button class="btn" onclick="startRecTimer()">${(()=>{const l=recList(S.session);let d=0,t2=0;for(const e of l){t2+=recRows(e);d+=S.session.entries[e.id].sets.filter(s=>s.done).length;}return d>0&&d<t2?`▶ RESUME GUIDED — ${t2-d} LEFT`:"▶ GUIDED STRETCH (BEEPS)";})()}</button>
        <div class="muted" style="font-size:10px;text-align:center;margin:8px 0">1 long beep = start · 2 short = switch · finish = triple + high tone.<br>Targets grow every clear.${S.profile==="eileen"||S.profile==="allison"?"<br>All seated or supported. Stretch to light tension, never pain.":""}</div>
        ${cards}
        <button class="btn" onclick="finishRec()">CLEAR DUNGEON</button>
        <button class="btn ghost" onclick="go('quest')">◂ BACK (progress saved)</button>
      </div></div>`;
}
function togRec(id,i){ const s=S.session.entries[id].sets[i]; s.done=!s.done; save(); vRecSession(); }
function startRecTimer(){
  const lst=recList(S.session);
  const ph=[];
  lst.forEach((e)=>{
    const rows=recRows(e);
    for(let h=0;h<rows;h++){
      if(S.session.entries[e.id].sets[h].done) continue;
      const secs = e.mode==="reps" ? Math.max(30, recVal(e)*4) : recVal(e);
      const lbl = e.name.toUpperCase()
        + (e.per?(h===0?" — LEFT":" — RIGHT"):"")
        + (e.mode==="reps"?" ("+recVal(e)+" REPS)":"");
      ph.push({l:lbl, s:secs, p:"walk", ex:e.id, h:h});
      ph.push({l:"SWITCH · BREATHE", s:12, p:"run"});
    }
  });
  if(ph.length && ph[ph.length-1].p==="run") ph.pop();
  if(!ph.length){ modal(`<h2>⚠ SYSTEM</h2><div>Every stretch is already complete.</div><button class="btn" onclick="closeModal()">OK</button>`); return; }
  startTimer(ph,"rec");
}
function finishRec(){
  const sess=S.session, lst=recList(sess), bonus=sess.kind==="rbonus";
  let done=0, total=0, det=[];
  for(const e of lst){
    const d=sess.entries[e.id].sets.filter(s=>s.done).length;
    total+=recRows(e); done+=d;
    if(d===recRows(e)){ S.recN[e.id]=(S.recN[e.id]||0)+1; }
    det.push(`${e.name}: ${d}/${recRows(e)} × ${recLbl(e)}`);
  }
  if(!done){ modal(`<h2>⚠ SYSTEM</h2><div>Nothing logged. Complete at least one stretch.</div><button class="btn" onclick="closeModal()">OK</button>`); return; }
  const all=done===total;
  const xp=(bonus?10:20)+(all?5:0);
  S.recDone++;
  if(bonus){ S.recBonusD=todayStr(); }
  if(sess.pool!==undefined){ poolState().used[sess.pool]=true; save(); }
  if(bonus){
    S.log.unshift({d:todayStr(), name:"RECOVERY BONUS", xp, det:det.join("\n")});
    S.session=null; gainXp(xp); save();
    modal(`<h2>⚠ BONUS CLEAR</h2><div class="big">+${xp} XP</div>
      <div class="muted">Flexibility is armor.</div>
      <button class="btn" onclick="finishClear()">COMPLETE</button>`);
    renderHeader();
  } else {
    completeCommon(recTitle(sess), xp, det.join("\n"),
      `<div class="muted">Flexibility is armor. Targets increase next visit.</div>`);
  }
}

function completeCommon(name, xp, detail, extraHtml){
  const t=todayStr();
  S.lastDone=t;
  S.log.unshift({d:t, name, xp, det:detail});
  if(S.log.length>200) S.log.length=200;
  S.session=null;
  gainXp(xp); save(); pushLB();
  modal(`<h2>⚠ DUNGEON CLEAR</h2>
    <div class="big">+${xp} XP</div>
    ${extraHtml||""}
    <button class="btn" onclick="finishClear()">COMPLETE</button>`);
  renderHeader();
}
/* ---------- stats ---------- */
function growthPct(){
  let sum=0,n=0;
  for(const id in S.ex){ const v=S.ex[id]; if(v.base>0&&v.best>0){ sum+=v.best/v.base-1; n++; } }
  return n? sum/n : 0;
}

  document.getElementById("view").innerHTML=`
    <div class="panel"><div class="ptitle"><div class="diamond"><span>i</span></div>STATUS WINDOW</div>
      <div class="pbody">
        <div class="rankbig"><small>HUNTER RANK</small><span class="r">${rankOf(S.level)}</span></div>
        <div class="statgrid">
          <div class="stat"><small>LEVEL</small><b>${S.level}</b></div>
          <div class="stat"><small>TOTAL XP</small><b>${S.totalXp.toLocaleString()}</b></div>
          <div class="stat"><small>GROWTH</small><b style="color:${g>0?'var(--good)':'#fff'}">${g>0?"+":""}${(g*100).toFixed(1)}%</b></div>
          <div class="stat"><small>DUNGEONS CLEARED</small><b>${S.quests+S.cardioDone+S.recDone}</b></div>
          <div class="stat"><small>DAILY QUESTS</small><b>${S.daily.count}</b></div>
          <div class="stat"><small>VOLUME LIFTED</small><b>${Math.round(S.tonnage/1000)}k lb</b></div>
          <div class="stat"><small>STREAK / BEST</small><b>${S.streak} / ${S.bestStreak}</b></div>
          <div class="stat"><small>ENDURANCE LV</small><b>${S.cardioLvl}</b></div>
        </div>
        ${attrs.map(([n,v])=>`<div class="attr"><div class="attrhead"><span>${n}</span><b>${v}</b></div>
          <div class="abar"><div class="afill" style="width:${v}%"></div></div></div>`).join("")}
        <div class="muted" style="font-size:10px;margin-top:8px">NEXT RANK: ${(()=>{const cur=rankOf(S.level);for(const[n,m]of RANKS){if(m>S.level)return n+" at level "+m;}return "MAX — SSS ACHIEVED";})()}</div>
      </div></div>
    <div class="panel"><div class="ptitle"><div class="diamond"><span>◆</span></div>THE GUILD</div>
      <div class="pbody" id="lbPanel"><div class="muted">CONNECTING…</div></div></div>
    <div class="panel"><div class="ptitle"><div class="diamond"><span>!</span></div>CURRENT WORKING WEIGHTS</div>
      <div class="pbody">${prs||`<div class="muted">No lifts calibrated yet. Clear your first quests — the System is watching.</div>`}</div></div>`;
  fetchLB(function(rows,live){
    const el=document.getElementById("lbPanel");
    if(el) el.innerHTML=lbRows(rows,live);
  });
}

/* ---------- weight ---------- */
function vWeight(){
  const ws=S.weights;
  let chart="", list="", summary="";
  if(ws.length){
    const last=ws[ws.length-1], first=ws[0];
    const prev=ws.length>1?ws[ws.length-2]:null;
    const dTot=(last.lbs-first.lbs);
    const dLast=prev?(last.lbs-prev.lbs):null;
    const col=d=>d<0?'var(--good)':d>0?'var(--bad)':'#fff';
    summary=`<div class="statgrid" style="grid-template-columns:1fr 1fr 1fr">
      <div class="stat"><small>CURRENT</small><b style="font-size:16px">${last.lbs} lb</b></div>
      <div class="stat"><small>VS LAST</small><b style="font-size:16px;color:${dLast===null?'#fff':col(dLast)}">${dLast===null?"—":(dLast>0?"+":"")+dLast.toFixed(1)+" lb"}</b></div>
      <div class="stat"><small>SINCE START</small><b style="font-size:16px;color:${col(dTot)}">${dTot>0?"+":""}${dTot.toFixed(1)} lb</b></div>
    </div>`;
    chart=drawChart(ws.slice(-60));
    list=ws.slice().reverse().map((w,i,arr)=>{
      const prv = arr[i+1];
      const d = prv? (w.lbs-prv.lbs) : 0;
      const cls = d<0?"dn":d>0?"up":"eq";
      return `<div class="wl"><span class="d">${w.d}</span><span><b>${w.lbs} lb</b>
        ${prv?`<span class="delta ${cls}"> ${d>0?"+":""}${d.toFixed(1)}</span>`:""}</span></div>`;
    }).join("");
  } else summary=`<div class="muted" style="text-align:center;padding:6px 0">Log your first weigh-in. Downward trend earns bonus XP.</div>`;
  if(!chart) chart=`
    <div style="height:170px;border:1px dashed rgba(177,108,255,.4);background:rgba(0,0,0,.25);
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px">
      <span style="letter-spacing:4px;font-size:12px;color:var(--pb);text-shadow:0 0 8px var(--p)">⚠ INSUFFICIENT DATA</span>
      <span class="muted" style="font-size:10px;letter-spacing:1px">TREND GRAPH UNLOCKS AT 2+ WEIGH-INS${ws.length===1?" — 1 LOGGED":""}</span>
    </div>`;
  document.getElementById("view").innerHTML=`
    <div class="panel"><div class="ptitle"><div class="diamond"><span>!</span></div>BODY WEIGHT</div>
      <div class="pbody">
        <div class="wrow">
          <input class="cin" style="flex:1;width:auto" type="number" inputmode="decimal" step="0.1" id="win" placeholder="Today's weight (lb)">
          <button class="logbtn" style="margin:0;padding:11px 16px" onclick="addWeight()">LOG</button>
        </div>
        <div style="margin-top:12px">${chart}</div>
        <div style="margin-top:10px">${summary}</div>
        <div class="wlist">${list}</div>
      </div></div>`;
}
function addWeight(){
  const v=parseFloat(document.getElementById("win").value);
  if(!(v>0)) return;
  const t=todayStr();
  const existing=S.weights.find(w=>w.d===t);
  if(existing) existing.lbs=v;
  else{
    S.weights.push({d:t,lbs:v});
    if(S.lastWeighXp!==t){
      S.lastWeighXp=t;
      const prev=S.weights.length>1?S.weights[S.weights.length-2].lbs:null;
      const bonus=(prev!==null && v<prev)?15:0;
      gainXp(10+bonus);
      if(bonus) modal(`<h2>⚠ NOTIFICATION</h2><div>Weigh-in logged.<br><b class="good">Weight down — +${10+bonus} XP</b></div><button class="btn" onclick="closeModal()">OK</button>`);
    }
  }
  save(); vWeight(); renderHeader();
}
function drawChart(ws){
  if(ws.length<2) return "";
  const W=480,H=170,P=26;
  const vals=ws.map(w=>w.lbs);
  let mn=Math.min(...vals), mx=Math.max(...vals);
  if(mx-mn<2){mx+=1;mn-=1;}
  const X=i=>P+ i*(W-2*P)/(ws.length-1);
  const Y=v=>H-P-(v-mn)*(H-2*P)/(mx-mn);
  const pts=ws.map((w,i)=>`${X(i).toFixed(1)},${Y(w.lbs).toFixed(1)}`).join(" ");
  const dots=ws.map((w,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(w.lbs).toFixed(1)}" r="2.6" fill="#d8b4fe"/>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="rgba(177,108,255,.35)"/>
    <text x="${P}" y="${Y(mx)-6}" fill="#9f8bc9" font-size="10">${mx}</text>
    <text x="${P}" y="${Y(mn)+13}" fill="#9f8bc9" font-size="10">${mn}</text>
    <polyline points="${pts}" fill="none" stroke="#b16cff" stroke-width="2.2" style="filter:drop-shadow(0 0 4px #b16cff)"/>
    ${dots}</svg>`;
}

/* ---------- log ---------- */
function vLog(){
  const ents=S.log.slice(0,40).map(l=>`<div class="logent">
    <div class="lh"><b>${l.name}</b><span>${l.d} · +${l.xp} XP</span></div>
    <div class="ld">${l.det}</div></div>`).join("");
  document.getElementById("view").innerHTML=`
    <div class="panel"><div class="ptitle"><div class="diamond"><span>i</span></div>QUEST LOG</div>
      <div class="pbody">${ents||`<div class="muted">No quests cleared yet.</div>`}</div></div>`;
}

/* ---------- system ---------- */
function vSys(){
  document.getElementById("view").innerHTML=`
    <div class="panel"><div class="ptitle"><div class="diamond"><span class="gear">⚙</span></div>SYSTEM</div>
      <div class="pbody">
        <div class="sect">PLAYER</div>
        <div class="goalrow"><span class="gname">Name</span><span class="gval">${S.name||"—"}</span></div>
        <div class="goalrow"><span class="gname">Profile</span><span class="gval">${prof().lbl}</span></div>
        <button class="btn ghost" onclick="askName(false)">CHANGE NAME / PROFILE</button>
        <div class="sect">THE GUILD</div>
        <div class="muted" style="font-size:11px;line-height:1.6">A friendly roster of family and friends — shares only your hunter name, level, rank and streak, never workouts or weight. ${S.lbOpt?'<b class="good">You are in the guild.</b>':'You are not in the guild yet.'}</div>
        <button class="btn ghost" onclick="S.lbOpt=!S.lbOpt;save();if(S.lbOpt){lbLast=0;pushLB();}vSys()">${S.lbOpt?"LEAVE THE GUILD (stop sharing)":"JOIN THE GUILD"}</button>
        <div class="sect">BACKUP</div>
        <div class="muted" style="font-size:11px;line-height:1.6">All data lives in this browser only. Export a backup occasionally.${S.lastBackup?` Last backup: ${S.lastBackup}.`:""}</div>
        <button class="btn ghost" onclick="exportData();vSys()">EXPORT DATA (download file)</button>
        <div class="sect">RESTORE</div>
        <input type="file" id="impFile" accept=".json,application/json,text/plain" style="display:none" onchange="importFile(this)">
        <button class="btn ghost" onclick="document.getElementById('impFile').click()">IMPORT FROM FILE</button>
        <textarea class="io" id="imp" placeholder="…or paste an exported backup here"></textarea>
        <button class="btn ghost" onclick="importData()">IMPORT PASTED TEXT</button>
        <div class="sect">DANGER ZONE</div>
        <button class="btn danger" onclick="resetAll()">RESET ALL DATA</button>
      </div></div>`;
}
function exportData(){
  S.lastBackup=todayStr(); save();
  const blob=new Blob([JSON.stringify(S)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`system-backup-${todayStr()}.json`;
  a.click();
}
function importFile(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ const ta=document.getElementById("imp"); if(ta) ta.value=r.result; importData(); };
  r.readAsText(f);
}
function importData(){
  try{
    const d=JSON.parse(document.getElementById("imp").value);
    if(typeof d.level!=="number") throw 0;
    S=Object.assign(defaultState(),d);
    if(!S.gateV) S.gateV={};
    if(Array.isArray(S.gateVar)){ S.gateV.hBack=S.gateVar[0]||0; S.gateV.hLegs=S.gateVar[1]||0; S.gateV.hSho=S.gateVar[2]||0; S.gateV.hChest=S.gateVar[4]||0; delete S.gateVar; }
    save();
    modal(`<h2>⚠ SYSTEM</h2><div class="good">Data restored.</div><button class="btn" onclick="closeModal();go('quest')">OK</button>`);
    renderHeader();
  }catch(e){
    modal(`<h2>⚠ SYSTEM</h2><div class="muted">Invalid backup data.</div><button class="btn" onclick="closeModal()">OK</button>`);
  }
}
function resetAll(){
  modal(`<h2>⚠ WARNING</h2><div>Erase ALL progress, history and calibration?<br><span class="muted">This cannot be undone.</span></div>
    <button class="btn danger" onclick="S=defaultState();save();closeModal();renderHeader();go('quest')">ERASE EVERYTHING</button>
    <button class="btn ghost" onclick="closeModal()">CANCEL</button>`);
}

/* ---------- boot ---------- */
const VIEWS={quest:vQuest, workout:vWorkout, stats:vStats, weight:vWeight, log:vLog, sys:vSys};
renderHeader(); renderNav();
if(S.session) go("workout"); else go("quest");
if(!S.name) askName(true);
pushLB();
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  navigator.serviceWorker.register("./sw.js").catch(function(){});
}
</script>
</body>
</html>
